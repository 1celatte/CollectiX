<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confirm Your Email - CollectiX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background-color: #ebf9ff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;
        }

        .confirm-card {
            width: 100%;
            max-width: 480px;

            background-color: #ffffff;

            border: 1px solid #dee2e6;

            border-radius: 14px;

            padding: 40px 35px;

            text-align: center;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .confirm-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background-color: #eaf4ff;

            color: #0d6efd;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        .confirm-card h2 {
            font-size: 28px;
            font-weight: 700;

            color: #212529;

            margin-bottom: 12px;
        }

        .confirm-card p {
            color: #6c757d;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 18px;
        }

        .email-box {
            background-color: #f8f9fa;

            border: 1px solid #e9ecef;

            border-radius: 9px;

            padding: 12px 15px;

            color: #212529;

            font-size: 15px;

            font-weight: 600;

            word-break: break-word;

            margin-bottom: 20px;
        }

        .confirm-btn {
            width: 100%;

            padding: 10px;

            border-radius: 8px;

            font-size: 14px;

            font-weight: 600;
        }

        .confirm-btn:hover {
            transform: translateY(-1px);
        }

        @media (max-width: 576px) {

            .confirm-card {
                padding: 32px 25px;
            }

            .confirm-card h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="confirm-card">

        <!-- Icon -->

        <div class="confirm-icon">

            <i class="bi bi-envelope-check"></i>

        </div>


        <!-- Header -->

        <h2>
            Confirm Your Email
        </h2>

        <p>
            You are verifying this email address:
        </p>


        <!-- Email -->

        <div class="email-box">
            {{ email }}
        </div>


        <p>
            Is this you?
        </p>


        <!-- Form -->

        <form
            method="POST"
            action="{{ url_for(
                'auth.confirm_email',
                token=token
            ) }}"
        >

            <button
                type="submit"
                class="btn btn-primary confirm-btn"
            >
                <i class="bi bi-check2-circle me-2"></i>
                Yes, this is me
            </button>

        </form>

    </div>

</body>

</html>
