{% extends "base.html" %}

{% block title %}
Forgot Password - CollectiX
{% endblock %}

{% block content %}

<style>

    .forgot-page {
        padding: 55px 0;
    }


    /* =========================
       MAIN CARD
    ========================= */

    .forgot-card {
        position: relative;
        overflow: hidden;

        max-width: 520px;
        margin: 0 auto;

        background: linear-gradient(
            135deg,
            #eef8fc,
            #f8fcfe
        );

        border: 1px solid #d2e8f2;

        border-radius: 22px;

        padding: 42px;

        box-shadow:
            0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .forgot-card::after {
        content: "";

        position: absolute;

        width: 150px;
        height: 150px;

        border-radius: 50%;

        background-color: rgba(13, 110, 253, 0.05);

        right: -55px;
        top: -55px;
    }

    .forgot-content {
        position: relative;
        z-index: 2;
    }


    /* =========================
       ICON
    ========================= */

    .forgot-icon {
        width: 65px;
        height: 65px;

        border-radius: 17px;

        background-color: #dceeff;

        color: #0d6efd;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 28px;

        margin-bottom: 22px;
    }


    /* =========================
       HEADER
    ========================= */

    .forgot-card h1 {
        font-size: 30px;

        font-weight: 700;

        color: #212529;

        margin-bottom: 9px;
    }

    .forgot-description {
        color: #6c757d;

        font-size: 14px;

        line-height: 1.6;

        margin-bottom: 28px;
    }


    /* =========================
       FORM
    ========================= */

    .form-label {
        font-size: 14px;

        font-weight: 600;

        color: #374151;

        margin-bottom: 8px;
    }

    .form-control {
        background-color: #ffffff;

        border: 1px solid #cfe2eb;

        border-radius: 10px;

        padding: 11px 13px;

        font-size: 14px;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .form-control:focus {
        border-color: #0d6efd;

        box-shadow:
            0 0 0 3px rgba(13, 110, 253, 0.10);
    }

    .form-control::placeholder {
        color: #adb5bd;
    }


    /* =========================
       ERROR
    ========================= */

    .error-message {
        color: #dc3545;

        font-size: 13px;

        margin-top: 7px;
    }


    /* =========================
       BUTTON
    ========================= */

    .continue-btn {
        width: 100%;

        border: none;

        border-radius: 10px;

        padding: 11px 15px;

        font-size: 14px;

        font-weight: 600;

        background: linear-gradient(
            135deg,
            #0d6efd,
            #087ea4
        );

        color: white;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .continue-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 7px 16px rgba(13, 110, 253, 0.20);
    }


    /* =========================
       BACK LINK
    ========================= */

    .back-login {
        display: inline-flex;

        align-items: center;

        gap: 6px;

        margin-top: 22px;

        color: #0d6efd;

        text-decoration: none;

        font-size: 14px;

        font-weight: 600;
    }

    .back-login:hover {
        text-decoration: underline;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 576px) {

        .forgot-page {
            padding: 30px 0;
        }

        .forgot-card {
            padding: 30px 25px;

            border-radius: 18px;
        }

        .forgot-card h1 {
            font-size: 27px;
        }

    }

</style>


<div class="container forgot-page">

    <div class="forgot-card">

        <div class="forgot-content">


            <!-- Icon -->

            <div class="forgot-icon">

                <i class="bi bi-envelope"></i>

            </div>


            <!-- Header -->

            <h1>
                Forgot Password?
            </h1>

            <p class="forgot-description">
                Enter your email address and we’ll send you
                a link to reset your password.
            </p>


            <!-- Form -->

            <form method="POST">

                <div class="mb-4">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >

                    {% if email_error %}

                        <div class="error-message">
                            ⚠ {{ email_error }}
                        </div>

                    {% endif %}

                </div>


                <!-- Continue -->

                <button
                    type="submit"
                    class="continue-btn"
                >
                    <i class="bi bi-arrow-right me-2"></i>
                    Continue
                </button>

            </form>


            <!-- Back -->

            <div class="text-center">

                <a
                    href="{{ url_for('auth.login') }}"
                    class="back-login"
                >
                    <i class="bi bi-arrow-left"></i>
                    Back to Login
                </a>

            </div>


        </div>

    </div>

</div>

{% endblock %}
