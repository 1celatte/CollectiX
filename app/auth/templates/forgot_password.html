{% extends "base.html" %}

{% block title %}
Forgot Password - CollectiX
{% endblock %}

{% block content %}

<style>
    .error-input {
        border: 2px solid red;
    }

    .error-message {
        color: red;
        font-size: 14px;
    }
</style>

<h1>Forgot Password</h1>

<form method="POST">

    <label>Email:</label>
    <input type="email"
           name="email"
           value="{{ email or '' }}"
           class="{% if email_error %}error-input{% endif %}"
           required>

    {% if email_error %}
        <div class="error-message">
            ⚠ {{ email_error }}
        </div>
    {% endif %}

    <br><br>

    <button type="submit">Continue</button>

</form>

<br>

<a href="{{ url_for('auth.login') }}">
    Back to Login
</a>

{% endblock %}
