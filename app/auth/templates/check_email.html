<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check Your Email - CollectiX</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background-color: #ebf9ff;
    }

    .email-box {
        width: 90%;
        max-width: 500px;
        background-color: white;
        padding: 45px 40px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .email-icon {
        font-size: 55px;
        margin-bottom: 20px;
    }

    h2 {
        margin-bottom: 15px;
        color: #222;
    }

    p {
        color: #666;
        line-height: 1.6;
        margin: 10px 0;
    }

    .email-text {
        font-weight: bold;
        color: #333;
    }

    .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 12px 28px;
        background-color: #0d6efd;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-size: 15px;
        transition: background-color 0.2s;
    }

    .btn:hover {
        background-color: #0b5ed7;
    }

    .small-text {
        font-size: 13px;
        color: #888;
        margin-top: 20px;
    }
</style>

</head>

<body>

<div class="email-box">

    <div class="email-icon">📧</div>

    <h2>Check Your Email</h2>

    <p>
        We have sent a verification link to your email address.
    </p>

    <p>
        Please check your inbox and click the verification link
        to verify your <span class="email-text">CollectiX</span> account.
    </p>

    <a href="{{ url_for('auth.login') }}" class="btn">
        Go to Login
    </a>

    <p class="small-text">
        Didn't receive the email? Please check your spam or junk folder.
    </p>

</div>

</body>

</html>
