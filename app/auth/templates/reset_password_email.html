<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your CollectiX Password</title>
</head>

<body>

    <h2>Hello {{ name }}!</h2>

    <p>
        We received a request to reset your CollectiX password.
    </p>

    <p>
        Please click the button below to reset your password.
    </p>

    <p>
        <a href="{{ reset_link }}">
            Reset My Password
        </a>
    </p>

    <p>
        This password reset link will expire in 30 minutes.
    </p>

    <p>
        If you did not request a password reset, you can ignore this email.
    </p>

    <p>
        Regards,<br>
        CollectiX Team
    </p>

</body>
</html>
