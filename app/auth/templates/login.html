{% extends "base.html" %}

{% block title %}
Login - CollectiX
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

    <div class="col-lg-6 col-md-8">

        <!-- Header -->
        <div class="mb-4">

            <h1 class="fw-bold mb-2">
                Login
            </h1>

            <p class="text-muted mb-0">
                Log in to your CollectiX account.
            </p>

        </div>


        <!-- Login Form -->
        <div class="bg-white border rounded-4 shadow-sm p-4 p-md-5">

            <form method="POST">

                <!-- Email -->
                <div class="mb-4">

                    <label
                        for="email"
                        class="form-label fw-semibold"
                    >
                        Email
                    </label>

                    <input
                        type="text"
                        id="email"
                        name="email"
                        value="{{ email or '' }}"
                        class="form-control {% if login_error %}is-invalid{% endif %}"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-4">

                    <label
                        for="password"
                        class="form-label fw-semibold"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control {% if login_error %}is-invalid{% endif %}"
                        placeholder="Enter your password"
                        required
                    >

                    {% if login_error %}

                        <div class="invalid-feedback">
                            ⚠ {{ login_error }}
                        </div>

                    {% endif %}

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary w-100 py-2 fw-semibold"
                >
                    Login
                </button>

            </form>

        </div>


        <!-- Register -->
        <div class="text-center mt-4">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a
                href="{{ url_for('auth.register') }}"
                class="text-primary text-decoration-none fw-semibold"
            >
                Register here
            </a>

        </div>


        <!-- Forgot Password -->
        <div class="text-center mt-2">

            <a
                href="{{ url_for('auth.forgot_password') }}"
                class="text-primary text-decoration-none"
            >
                Forgot Password?
            </a>

        </div>

    </div>

</div>

</div>

{% endblock %}
