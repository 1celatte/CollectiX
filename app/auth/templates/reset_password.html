<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - CollectiX</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;

            background-color: #ebf9ff;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: Arial, sans-serif;
        }


        /* =========================
           CARD
        ========================= */

        .reset-card {
            width: 100%;
            max-width: 480px;

            background-color: #ffffff;

            border: 1px solid #dee2e6;

            border-radius: 14px;

            padding: 40px 35px;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.06);
        }


        /* =========================
           ICON
        ========================= */

        .reset-icon {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background-color: #eaf4ff;

            color: #0d6efd;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }


        /* =========================
           HEADER
        ========================= */

        .reset-card h2 {
            text-align: center;

            font-size: 27px;

            font-weight: 700;

            color: #212529;

            margin-bottom: 8px;
        }

        .reset-description {
            text-align: center;

            color: #6c757d;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }


        /* =========================
           FORM
        ========================= */

        .form-label {
            font-size: 14px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;
        }

        .form-control {
            background-color: #ffffff;

            border: 1px solid #ced4da;

            border-radius: 9px;

            padding: 10px 12px;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.10);
        }

        .form-control::placeholder {
            color: #adb5bd;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {
            color: #dc3545;

            font-size: 13px;

            margin-top: 8px;

            margin-bottom: 18px;
        }


        /* =========================
           BUTTON
        ========================= */

        .reset-btn {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 11px 15px;

            background-color: #0d6efd;

            color: white;

            font-size: 14px;

            font-weight: 600;

            transition:
                background-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .reset-btn:hover {
            background-color: #0b5ed7;

            transform: translateY(-1px);

            box-shadow:
                0 5px 14px rgba(13, 110, 253, 0.18);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 576px) {

            .reset-card {
                padding: 32px 25px;

                border-radius: 12px;
            }

            .reset-card h2 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="reset-card">


        <!-- Icon -->

        <div class="reset-icon">

            <i class="bi bi-lock"></i>

        </div>


        <!-- Header -->

        <h2>
            Reset Password
        </h2>

        <p class="reset-description">
            Enter your new password and confirm it below.
        </p>


        <!-- Form -->

        <form method="POST">


            <!-- New Password -->

            <div class="mb-3">

                <label
                    for="new_password"
                    class="form-label"
                >
                    New Password
                </label>

                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    class="form-control {% if password_error %}is-invalid{% endif %}"
                    placeholder="Enter your new password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="mb-3">

                <label
                    for="confirm_password"
                    class="form-label"
                >
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="form-control {% if password_error %}is-invalid{% endif %}"
                    placeholder="Re-enter your new password"
                    required
                >

            </div>


            <!-- Error -->

            {% if password_error %}

                <div class="error-message">
                    ⚠ {{ password_error }}
                </div>

            {% endif %}


            <!-- Button -->

            <button
                type="submit"
                class="reset-btn"
            >
                <i class="bi bi-shield-lock me-2"></i>
                Reset Password
            </button>


        </form>


    </div>

</body>

</html>
