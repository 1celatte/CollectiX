{% extends "base.html" %}

{% block title %}
Reset Password - CollectiX
{% endblock %}

{% block content %}

<style>
    .error-input {
        border: 2px solid red;
    }

    .error-message {
        color: red;
        font-size: 14px;
    }
</style>

<h1>Reset Password</h1>

<form method="POST">

    <label>New Password:</label>
    <input type="password"
           name="new_password"
           class="{% if password_error %}error-input{% endif %}"
           required>

    <br><br>

    <label>Confirm New Password:</label>
    <input type="password"
           name="confirm_password"
           class="{% if password_error %}error-input{% endif %}"
           required>

    {% if password_error %}
        <div class="error-message">
            ⚠ {{ password_error }}
        </div>
    {% endif %}

    <br><br>

    <button type="submit">Reset Password</button>

</form>

{% endblock %}
