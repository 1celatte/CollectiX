<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CollectiX</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 100px;
    }

    .reset-box {
        max-width: 500px;
        margin: auto;
    }

    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    label {
        margin-bottom: 5px;
    }

    input {
        width: 300px;
        padding: 10px;
        margin-bottom: 10px;
        box-sizing: border-box;
    }

    .error-input {
        border: 2px solid red;
    }

    .error-message {
        color: red;
        font-size: 14px;
        margin-top: 5px;
        margin-bottom: 10px;
    }

    button {
        padding: 10px 20px;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0b5ed7;
    }
</style>

</head>

<body>

<div class="reset-box">

    <h1>Reset Password</h1>

    <form method="POST">

        <label>New Password:</label>

        <input
            type="password"
            name="new_password"
            class="{% if password_error %}error-input{% endif %}"
            required
        >

        <label>Confirm New Password:</label>

        <input
            type="password"
            name="confirm_password"
            class="{% if password_error %}error-input{% endif %}"
            required
        >

        {% if password_error %}
            <div class="error-message">
                ⚠ {{ password_error }}
            </div>
        {% endif %}

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>

</html>
