{% extends "base.html" %}

{% block title %}
Edit Marketplace Listing
{% endblock %}

{% block content %}

<!--Page heading-->
<div class="mb-4">
    <h1 class="display-6 fw-bold mb-2">Edit Listing</h1>
</div>

<!--Show validation error without leaving this page-->
{% if error %}
    <div class="alert alert-danger" role="alert">
        {{ error }}
    </div>
{% endif %}

<!--Show which item this listing is for.-->
<div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
        <form
            method="POST"
            enctype="multipart/form-data"
        >
            <!--Show the item for this listing; it cannot be changed while editing.-->
            <div class="mb-4">
                <label class="form-label fw-semibold">Item</label>
                <div class="form-control bg-light text-muted">{{ item.name }}</div>
            </div>

            <!--User replaces the listing image only when a new image is selected.-->
            <div class="mb-4">
                <label for="image" class="form-label fw-semibold">Item Image</label>

                <input
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*"
                    class="form-control"
                >
            </div>

            <!--User updates the item's condition-->
            <div class="mb-4">
                <label for="condition" class="form-label fw-semibold">Condition</label>

                <select
                    id="condition"
                    name="condition"
                    class="form-select"
                >
                    <option value="Brand New" {% if listing.condition == "Brand New" %}selected{% endif %}>
                        Brand New
                    </option>
                    <option value="Like New" {% if listing.condition == "Like New" %}selected{% endif %}>
                        Like New
                    </option>
                    <option value="Good" {% if listing.condition == "Good" %}selected{% endif %}>
                        Good
                    </option>
                    <option value="Fair" {% if listing.condition == "Fair" %}selected{% endif %}>
                        Fair
                    </option>
                    <option value="Poor" {% if listing.condition == "Poor" %}selected{% endif %}>
                        Poor
                    </option>
                </select>
            </div>

            <!--User updates to sell or to trade-->
            <div class="mb-4">
                <label for="listing_type" class="form-label fw-semibold">Listing Type</label>

                <select
                    id="listing_type"
                    name="listing_type"
                    class="form-select"
                >
                    <option value="sell" {% if listing.listing_type == "sell" %}selected{% endif %}>
                        Sell
                    </option>
                    <option value="trade" {% if listing.listing_type == "trade" %}selected{% endif %}>
                        Trade
                    </option>
                </select>
            </div>

            <!--User updates the description-->
            <div class="mb-4">
                <label for="description" class="form-label fw-semibold">Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    cols="40"
                    class="form-control"
                >{{ listing.description or "" }}</textarea>
            </div>

            <!--User updates the price. (leave empty for trade)-->
            <div class="mb-4">
                <label for="price" class="form-label fw-semibold">Price (RM)</label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    step="0.01"
                    value="{{ listing.price if listing.price is not none else '' }}"
                    class="form-control"
                >
                <div class="form-text">Leave this empty for a trade listing.</div>
            </div>

            <!--Submit the edited information-->
            <div class="d-flex flex-column flex-sm-row gap-2">
                <button type="submit" class="btn btn-primary px-4">
                    Save Changes
                </button>

                <!--Return without saving any changes-->
                <a
                    href="{{ url_for('marketplace.my_listings') }}"
                    class="btn btn-outline-secondary px-4"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
