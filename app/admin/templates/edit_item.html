{% extends "base.html" %}

{% block title %}Edit Item - CollectiX{% endblock %}

{% block content %}

<h1>Edit Item</h1>

<form method="POST" enctype="multipart/form-data">

    <label>Name:</label>
    <input
        type="text"
        name="name"
        value="{{ item.name }}"
        required
    >

    <br><br>

    <label>Current Image:</label>

    <br><br>

    <div class="image-box">

        {% if item.image %}

            <img
                src="{{ url_for(
                    'collection.static',
                    filename='uploads/' + item.image
                ) }}"
                alt="{{ item.name }}"
            >

        {% else %}

            <span>No Image</span>

        {% endif %}

    </div>

    {% if item.image %}

        <br>

        <label>
            <input
                type="checkbox"
                name="remove_image"
                value="1"
            >
            Remove Image
        </label>

    {% endif %}

    <br><br>

    <label>Change Image:</label>

    <input
        type="file"
        name="image"
        accept="image/*"
    >

    <br><br>

    <label>Description:</label>

    <textarea name="description">{{ item.description }}</textarea>

    <br><br>

    <button type="submit" class="save-btn">
        Save Changes
    </button>

</form>

<br>

<a href="{{ url_for(
    'admin.collection_items',
    collection_id=item.collection_id
) }}">
    <button type="button">
        ← Back
    </button>
</a>

<style>

    .image-box {
        width: 150px;
        height: 150px;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #f8f8f8;
    }

    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .image-box span {
        color: #888;
        font-size: 14px;
    }

</style>

{% endblock %}
