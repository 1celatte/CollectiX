{% extends "base.html" %}

{% block title %}Manage Items - CollectiX{% endblock %}

{% block content %}

<h1>Manage Items</h1>

{% for item in items %}

    <div>
        <h2>{{ item.name }}</h2>

        <p>{{ item.description }}</p>

        <p>Status: {{ item.status }}</p>

        <a href="{{ url_for('admin.edit_item', item_id=item.id) }}">
            <button type="button">Edit</button>
        </a>

        <form method="POST" action="{{ url_for('admin.remove_item', item_id=item.id) }}">
            <button type="submit">Remove</button>
        </form>

    </div>

    <hr>

{% endfor %}

{% endblock %}
