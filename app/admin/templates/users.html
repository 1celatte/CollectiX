<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Users - CollectiX</title>
</head>

<body>

<h1>Manage Users</h1>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>

        {% for user in users %}

        <tr>

            <td>{{ user.id }}</td>

            <td>{{ user.name }}</td>

            <td>{{ user.email }}</td>

            <td>{{ user.role }}</td>

            <td>

                {% if user.role != "admin" %}

                <button
                    type="button"
                    class="remove-btn"
                    popovertarget="deleteUser{{ user.id }}"
                >
                    Delete
                </button>

                <div
                    id="deleteUser{{ user.id }}"
                    popover
                    class="delete-popup"
                >

                    <div class="delete-box">

                        <p>
                            Are you sure you want to delete this user?
                        </p>

                        <form
                            action="{{ url_for(
                                'admin.remove_user',
                                user_id=user.id
                            ) }}"
                            method="POST"
                        >

                            <button
                                type="submit"
                                class="delete-confirm"
                            >
                                Yes
                            </button>

                            <button
                                type="button"
                                class="cancel-btn"
                                popovertarget="deleteUser{{ user.id }}"
                                popovertargetaction="hide"
                            >
                                Cancel
                            </button>

                        </form>

                    </div>

                </div>

                {% else %}

                    -

                {% endif %}

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

<br>

<a
    href="{{ url_for('admin.dashboard') }}"
    class="back-btn"
>
    Back to Dashboard
</a>


<style>

    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
    }

    th,
    td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
        vertical-align: middle;
    }

    th {
        background-color: #f2f2f2;
    }


    /* Delete button */

    .remove-btn {
        display: inline-block;
        padding: 6px 12px;
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .remove-btn:hover {
        background-color: #bb2d3b;
    }


    /* Popup */

    .delete-popup {
        padding: 0;
        border: none;
        background: transparent;
    }


    /* Popup box */

    .delete-box {
        background-color: white;
        padding: 25px;
        border-radius: 8px;
        width: 350px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }


    /* Yes button */

    .delete-confirm {
        padding: 6px 15px;
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }


    /* Cancel button */

    .cancel-btn {
        padding: 6px 15px;
        background-color: #6c757d;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 5px;
    }

    .cancel-btn:hover {
        background-color: #5c636a;
    }


    /* Back button */

    .back-btn {
        display: inline-block;
        padding: 8px 15px;
        background-color: #6c757d;
        color: white;
        text-decoration: none;
        border-radius: 4px;
    }

    .back-btn:hover {
        background-color: #5c636a;
    }

</style>

</body>
</html>
