{% extends "base.html" %}

{% block title %}Admin Dashboard - CollectiX{% endblock %}

{% block content %}

<h1>Admin Dashboard</h1>

<p>Welcome, Admin!</p>

<div>
    <a href="{{ url_for('admin.submissions') }}">
        Submissions
        {% if pending_count > 0 %}
            <span class="badge">{{ pending_count }}</span>
        {% endif %}
    </a>
</div>

<div>
    <a href="{{ url_for('admin.collections') }}">Collections</a>
</div>

<div>
    <a href="{{ url_for('admin.users') }}">Users</a>
</div>

<div>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</div>

<style>
.dashboard-links {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-width: 300px;
}

.dashboard-btn {
    display: inline-block;
    padding: 12px 20px;
    background-color: #f0f0f0;
    color: #000;
    text-decoration: none;
    border-radius: 6px;
}

.dashboard-btn:hover {
    background-color: #ddd;
}

.badge {
    background-color: red;
    color: white;
    padding: 3px 7px;
    border-radius: 10px;
    font-size: 12px;
    margin-left: 5px;
}
</style>

{% endblock %}
