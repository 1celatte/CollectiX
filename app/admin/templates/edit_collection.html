{% extends "base.html" %}

{% block title %}Edit Collection - CollectiX{% endblock %}

{% block content %}

<h1>Edit Collection</h1>

<form method="POST" enctype="multipart/form-data">

<label>Name:</label>
<input
    type="text"
    name="name"
    value="{{ collection.name }}"
    required
>

<br><br>

<label>Tag:</label>

<select name="tag_id" required>

    {% for tag in tags %}

        <option
            value="{{ tag.id }}"
            {% if collection.tag_id == tag.id %}
                selected
            {% endif %}
        >
            {{ tag.name }}
        </option>

    {% endfor %}

</select>

<br><br>

<label>Current Image:</label>

<br><br>

<div class="image-box">

    {% if collection.image %}

        <img
            src="{{ url_for(
                'collection.static',
                filename='uploads/' + collection.image
            ) }}"
            alt="{{ collection.name }}"
        >

    {% else %}
        <span>No Image</span>

{% endif %}

</div>

{% if collection.image %}

    <br>

    <label>
        <input
            type="checkbox"
            name="remove_image"
            value="1"
        >
        Remove Image
    </label>
    
{% endif %}

<br>

<label>Change Image:</label>

<input
    type="file"
    name="image"
    accept="image/*"
>

<br><br>

<label>Description:</label>

<textarea name="description">{{ collection.description }}</textarea>

<br><br>

<button type="submit" class="save-btn">
    Save Changes
</button>

</form>

<br>

<a href="{{ url_for('admin.collections') }}">
    <button type="button">
        ← Back
    </button>
</a>

<style>

    .image-box {
        width: 150px;
        height: 150px;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: #f8f8f8;
    }

    .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .image-box span {
        color: #888;
        font-size: 14px;
    }

</style>

{% endblock %}
