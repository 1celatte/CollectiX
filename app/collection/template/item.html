<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item</title>
</head>

<body>

    <h1>Add Item to {{ collection.name }}</h1>

    <p>
        You are adding a new item to:
        <strong>{{ collection.name }}</strong>
    </p>

    <form method="POST" enctype="multipart/form-data">

        <div>
            <label for="name">Item Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
            >
        </div>

        <br>

        <div>
            <label for="description">Description:</label>
            <br>
            <textarea
                id="description"
                name="description"
                rows="5"
                cols="40"
            ></textarea>
        </div>

        <br>

        <div>
            <label for="image">Item Image:</label>
            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
            >
        </div>

        <br>

        <button type="submit">Submit Item</button>

    </form>

    <br>

    <a href="{{ url_for('collection.view_collection', collection_id=collection.id) }}">
        ← Back to Collection
    </a>

</body>
</html>
