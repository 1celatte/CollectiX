<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browse Collections - CollectiX</title>

    <!--Bootstrap CSS-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

    <main class="container py-5">

        <!--page heading-->
        <h1 class="mb-2">Browse Collections</h1>

        <!--page description-->
        <p class="text-muted mb-4">
            Explore public collectible collections.
        </p>

        <!--Search and filter form-->
        <form method="GET" action="/browse/" class="card p-3 mb-4">

            <div class="row g-2">

                <!--search by keyword-->
                <div class="col-md-6">
                    <input type="text"
                           name="q"
                           class="form-control"
                           placeholder="Search collections...">
                </div>

                <!--filter by category （option only for testing)-->
                <div class="col-md-3">
                    <select name="category" class="form-select">
                        <option value="">All categories</option>
                        <option value="anime">Anime</option>
                        <option value="gaming">Gaming</option>
                        <option value="blind-box">Blind Box</option>
                    </select>
                </div>

                <!--sort option-->
                <div class="col-md-3">
                    <select name="sort" class="form-select">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                        <option value="name">Name A-Z</option>
                    </select>
                </div>

            </div>

            <!--Search button-->
            <button type="submit" class="btn btn-primary mt-3">
                Search
            </button>

        </form>

    </main>

</body>

</html>
