<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>All Items - CollectiX</title>
</head>

<body>
    <h1>All Collectible Items</h1>
    {% if items %}
        {% for item in items %}
            <div>
                <h2>{{ item.name }}</h2>
                <p>{{ item.description or "No description available." }}</p>
                <p>Collection ID: {{ item.collection_id }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>No approved collectible items are available yet!</p>
    {% endif %}
</body>

</html>
