<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CollectiX{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <div class="d-flex align-items-center">
                <a class="navbar-brand me-3" href="/">
                    CollectiX
                </a>

                <form action="{{ url_for('browse.browse_page') }}" method="GET" class="d-flex ms-3">
                    <input
                        type="text"
                        name="q"
                        class="form-control"
                        placeholder="Search collections or items..."
                        style="width: 300px;"
                    >
                    <button type="submit" class="btn btn-light ms-2">
                        <i class="bi bi-search"></i>
                    </button>

                </form>

            </div>

        </div>

    </nav>
    
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center py-4 text-muted">
        <p>&copy; 2026 CollectiX</p>
    </footer>
</body>

</html>
