<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CollectiX{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >
</head>

<body style="background-color: #ebf9ff;">

    <nav
        class="navbar navbar-expand-lg navbar-dark"
        style="background-color: #000000;"
    >

        <div class="container">

            <!-- CollectiX -->
            <a class="navbar-brand fw-bold" href="/">
                CollectiX
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div
                class="collapse navbar-collapse"
                id="navbarContent"
            >

                <!-- Navigation Links -->
                <ul class="navbar-nav me-auto">

                    <!-- Home -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('home') }}"
                        >
                            <i class="bi bi-house me-1"></i>
                            Home
                        </a>
                    </li>

                    <!-- Search -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('browse.browse_page') }}"
                        >
                            <i class="bi bi-search me-1"></i>
                            Search
                        </a>
                    </li>

                    <!-- Collections -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('collection.list_collections') }}"
                        >
                            <i class="bi bi-collection me-1"></i>
                            Collections
                        </a>
                    </li>

                    <!-- Marketplace -->
                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="{{ url_for('marketplace.marketplace_home') }}"
                        >
                            <i class="bi bi-shop me-1"></i>
                            Marketplace
                        </a>
                    </li>

                </ul>

                <!-- Right Side -->
                <div class="d-flex">

                    {% if current_user.is_authenticated %}

                        <a
                            href="{{ url_for('auth.profile') }}"
                            class="btn btn-outline-light"
                        >
                            <i class="bi bi-person-circle me-1"></i>
                            Profile
                        </a>

                    {% else %}

                        <a
                            href="{{ url_for('auth.login') }}"
                            class="btn btn-outline-light"
                        >
                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Login
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4 text-muted">
        <p>&copy; 2026 CollectiX</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
