{% extends "base.html" %}

<!--Page Title-->
{% block title %}
Home - CollectiX
{% endblock %}

{% block content %}

<!--Main welcome area of the homepage-->
<div class="text-center py-5">

    <!--Main heading-->
    <h1 class="display-4 fw-bold">
        Welcome to CollectiX
    </h1>

    <!--Short introduction-->
    <p class="lead">
        Illustrated collection system, items buy/sell and exchange platform
    </p>

    <!--Browse collections button-->
    <a href="{{ url_for('collection.list_collections') }}" class="btn btn-primary me-2">
        Browse Collections
    </a>

    <!--My Listings button-->
    <a href="{{ url_for('marketplace.my_listings') }}" class="btn btn-outline-primary">
        My Listings
    </a>

    <!--Profile action button-->
    <a href="{{ url_for('auth.profile') }}" class="btn btn-primary">
        View Profile
    </a>

</div>
{% endblock %}
